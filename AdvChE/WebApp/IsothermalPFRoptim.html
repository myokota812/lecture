/* ============================================================
 * 5. IN-SCOPE PRE-BAKED COMPONENT CLASSES
 *    Interactive controls + simple display components only (Decision D5).
 *    Complex components (timeline, sequence, stepper, pros-cons, hero, HUD,
 *    hotspot, media grid) are intentionally excluded.
 * ============================================================ */

/* Global font rendering quality + themed surface backdrop.
 * background/color MUST be set here (SSoT) so the widget backdrop follows the
 * light/dark surface token deterministically. Without this, a widget whose
 * model-generated markup forgets `background: var(--surface)` on its root
 * container falls back to the browser-default white body, producing a broken
 * dark mode (light header/chart area behind a dark card). Regression source:
 * batch1 PB-A02 dark. */
*, *::before, *::after {
  box-sizing: border-box;
}

html, body {
  background: var(--body-bg, transparent) !important;
  color: var(--on-surface) !important;
  /* Auto-resizing iframe: content grows the frame, never scrolls the document.
   * Model widgets already emit this; declared here as the SSoT default. */
  overflow-y: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-optical-sizing: auto;
  text-rendering: optimizeLegibility;
}

.widget-container {
  width: 100% !important;
  max-width: 100% !important;
  padding-inline: 0 !important;
  box-sizing: border-box;
}

/* ============================================================
 * SCROLLBAR DISCIPLINE (single source of truth)
 *   Long lists/cards flow and let the iframe auto-resize (see the C++
 *   NeutralizeInnerScroll pass, which removes accidental tiny scroll boxes).
 *   For LEGITIMATE overflow that remains (wide tables, code, pan-containers,
 *   large >=240px viewports) render a slim, theme-aware scrollbar.
 *   One token carries the correct light/dark contrast (the auto-flipped
 *   stroke token is too dark on #0f0f0f), referenced once = SSoT.
 * ============================================================ */

::-webkit-scrollbar-thumb {
  background-color: var(--lumi-scrollbar-thumb);
  border-radius: var(--lumi-sys-shape--full, 999px);
}

              <span class="lumi-legend-dot" id="legend-dot-sb" style="background-color: var(--chart-8);"></span>
              <span class="lumi-legend-label">Selectivity (<i>S</i><sub><i>B</i></sub>)</span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="control-deck" aria-label="Kinetic and reactor parameters">
      <div class="control-row">
        <div class="control-row-header">
          <label class="control-label lumi-body-m" for="slider-e1">
            Activation Energy <i>E</i><sub>1</sub> <span class="control-meta lumi-body-s">(<i>A</i> &rarr; <i>B</i>)</span>
          </label>
          <div id="slider-e1-val" class="lumi-slider-value lumi-code">50 kJ/mol</div>
        </div>
        <input type="range" id="slider-e1" class="lumi-slider" min="30" max="90" step="1" value="50" style="--progress: 33.33%;" aria-label="Activation Energy E1 in kJ per mol">
      </div>

      <div class="control-row">
        <div class="control-row-header">
          <label class="control-label lumi-body-m" for="slider-e2">
            Activation Energy <i>E</i><sub>2</sub> <span class="control-meta lumi-body-s">(<i>B</i> &rarr; <i>C</i>)</span>
          </label>
          <div id="slider-e2-val" class="lumi-slider-value lumi-code">70 kJ/mol</div>
        </div>
        <input type="range" id="slider-e2" class="lumi-slider" min="30" max="90" step="1" value="70" style="--progress: 66.67%;" aria-label="Activation Energy E2 in kJ per mol">
      </div>

      <div class="control-row">
        <div class="control-row-header">
          <label class="control-label lumi-body-m" for="slider-tau">
            Space Time &tau; <span class="control-meta lumi-body-s">(residence time)</span>
          </label>
          <div id="slider-tau-val" class="lumi-slider-value lumi-code">10 s</div>
        </div>
        <input type="range" id="slider-tau" class="lumi-slider" min="1" max="60" step="1" value="10" style="--progress: 15.25%;" aria-label="Space Time tau in seconds">
      </div>
    </section>
  </div>

  <script>
    const A1 = 1.0e6;
    const A2 = 1.0e8;
    const R_GAS = 8.314;
    const TEMPS = [];
    for (let t = 300; t <= 600; t += 2) {
      TEMPS.push(t);
    }

    const state = {
      E1: 50,
      E2: 70,
      tau: 10
    };

    let pfrChart = null;
    let latestMetrics = [];

    function getLumiChartTokens() {
      const cs = getComputedStyle(document.documentElement);
      return {
        fontFamily: cs.getPropertyValue('--ff-sans').trim() || "'Google Sans Flex', sans-serif",
        monoFamily: cs.getPropertyValue('--ff-mono').trim() || "'Google Sans Code', monospace",
        textColor: cs.getPropertyValue('--on-surface').trim() || '#000000',
        deEmphasisColor: cs.getPropertyValue('--on-surface-variant').trim() || 'rgba(0,0,0,0.62)',
        gridColor: cs.getPropertyValue('--stroke-default').trim() || 'rgba(0,0,0,0.08)',
        surfaceColor: cs.getPropertyValue('--surface-bright').trim() || '#ffffff',
        series: [
          cs.getPropertyValue('--chart-1').trim() || '#2575fc',
          cs.getPropertyValue('--chart-2').trim() || '#5b6e9e',
          cs.getPropertyValue('--chart-3').trim() || '#228a49',
          cs.getPropertyValue('--chart-4').trim() || '#62991b',
          cs.getPropertyValue('--chart-5').trim() || '#1e564d',
          cs.getPropertyValue('--chart-6').trim() || '#526a45',
          cs.getPropertyValue('--chart-7').trim() || '#2780c4',
          cs.getPropertyValue('--chart-8').trim() || '#997112',
          cs.getPropertyValue('--chart-9').trim() || '#705ec2',
          cs.getPropertyValue('--chart-10').trim() || '#c84288',
        ],
        alpha: function(c, a) {
          c = ('' + c).trim();
          if (c.charAt(0) === '#') {
            var h = c.slice(1);
            if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
            return 'rgba(' + parseInt(h.slice(0,2),16) + ',' + parseInt(h.slice(2,4),16) + ',' + parseInt(h.slice(4,6),16) + ',' + a + ')';
          }
          if (c.slice(0,3) === 'rgb') {
            var p = c.slice(c.indexOf('(')+1, c.indexOf(')')).split(',');
            return 'rgba(' + (p[0]||'0').trim() + ',' + (p[1]||'0').trim() + ',' + (p[2]||'0').trim() + ',' + a + ')';
          }
          return c;
        }
      };
    }

    function enableChartKeyboardA11y(chart) {
      const cv = chart && chart.canvas;
      if (!cv || cv.dataset.lumiChartKeyBound) return;
      cv.dataset.lumiChartKeyBound = '1';
      cv.setAttribute('tabindex', '0');
      cv.setAttribute('role', 'application');
      cv.setAttribute('aria-roledescription', 'interactive chart');
      const card = cv.closest('[class*="lumi-card"], [class*="chart-card"], [class*="card"], section') || cv.parentElement;
      const h = card && card.querySelector('.lumi-chart-title, h1, h2, h3, h4');
      const name = (h && h.textContent.trim()) || (cv.getAttribute('aria-label') || '').replace(/\.?\s*Use Left and Right arrow keys.*$/i, '').split(/\s*(?::|—|\.\s)/)[0].trim() || 'Interactive chart';
      cv.setAttribute('aria-label', `${name.replace(/\.\s*$/, '')}. Use Left and Right arrow keys to navigate data points.`);
      let live = document.getElementById('lumi-chart-live');
      if (!live) {
        live = document.createElement('div');
        live.id = 'lumi-chart-live';
        live.setAttribute('role', 'status');
        live.setAttribute('aria-live', 'polite');
        live.setAttribute('aria-atomic', 'true');
        live.style.cssText = 'position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;';
        document.body.appendChild(live);
      }
      let idx = -1;
      cv.addEventListener('keydown', (e) => {
        if (e.defaultPrevented) return;
        if (!['ArrowRight', 'ArrowLeft', 'ArrowDown', 'ArrowUp', 'Home', 'End', 'Escape'].includes(e.key)) return;
        if (e.key === 'Escape') {
          idx = -1;
          chart.setActiveElements([]);
          if (chart.tooltip) chart.tooltip.setActiveElements([], { x: 0, y: 0 });
          chart.update('none');
          return;
        }
        const dsList = chart.data.datasets || [];
        const visDs = dsList.map((_, d) => d).filter(d => chart.isDatasetVisible(d) && (dsList[d].data || []).length);
        if (!visDs.length) return;
        const steps = [];
        const len = Math.max(...visDs.map(d => dsList[d].data.length));
        for (let i = 0; i < len; i++) steps.push(visDs.filter(d => dsList[d].data[i] != null).map(d => ({ datasetIndex: d, index: i })));
        if (!steps.length) return;
        e.preventDefault();
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') idx = (idx + 1) % steps.length;
        else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') idx = idx <= 0 ? steps.length - 1 : idx - 1;
        else if (e.key === 'Home') idx = 0;
        else if (e.key === 'End') idx = steps.length - 1;
        const active = steps[idx];
        const meta = chart.getDatasetMeta(active[0].datasetIndex);
        const el = meta && meta.data && meta.data[active[0].index];
        const pos = el && el.tooltipPosition ? el.tooltipPosition() : { x: 0, y: 0 };
        chart.setActiveElements(active);
        if (chart.tooltip) chart.tooltip.setActiveElements(active, pos);
        chart.update('none');
        const tt = chart.tooltip;
        const msg = (tt && tt.body && tt.body.length)
          ? ((tt.title || []).join(' ') ? (tt.title.join(' ') + ': ') : '') + tt.body.map(b => (b.lines || []).join(' ')).join('; ')
          : active.map(a => `${dsList[a.datasetIndex].label || 'Value'}: ${JSON.stringify(dsList[a.datasetIndex].data[a.index])}`).join(', ');
        live.replaceChildren(document.createTextNode(`${msg} (${idx + 1} of ${steps.length})`));
      });
    }

    function computeKinetics(E1_kJ, E2_kJ, tau) {
      const E1 = E1_kJ * 1000;
      const E2 = E2_kJ * 1000;
      const xaArr = [];
      const ybArr = [];
      const sbArr = [];
      const metrics = [];

      let maxYB = -1;
      let optT = TEMPS[0];

      for (let i = 0; i < TEMPS.length; i++) {
        const T = TEMPS[i];
        const k1 = A1 * Math.exp(-E1 / (R_GAS * T));
        const k2 = A2 * Math.exp(-E2 / (R_GAS * T));
        const k1Tau = k1 * tau;
        const k2Tau = k2 * tau;

        const exp1 = Math.exp(-k1Tau);
        const exp2 = Math.exp(-k2Tau);
        const xa = 1 - exp1;

        let yb;
        const relDiff = Math.abs(k2 - k1) / Math.max(k1, k2, 1e-30);
        if (relDiff < 1e-6) {
          yb = k1Tau * exp1;
        } else {
          yb = (k1 / (k2 - k1)) * (exp1 - exp2);
        }
        yb = Math.max(0, Math.min(1, yb));

        let sb;
        if (xa < 1e-8) {
          sb = 1.0;
        } else {
          sb = Math.max(0, Math.min(1, yb / xa));
        }

        xaArr.push(xa);
        ybArr.push(yb);
        sbArr.push(sb);
        metrics.push({ T, xa, yb, sb, k1, k2 });

        if (yb > maxYB) {
          maxYB = yb;
          optT = T;
        }
      }

      return { xaArr, ybArr, sbArr, metrics, maxYB, optT };
    }

    function formatRateConstant(k) {
      if (k === 0) return '0.00 s⁻¹';
      if (k >= 0.01 && k < 1000) return k.toFixed(3) + ' s⁻¹';
      return k.toExponential(2) + ' s⁻¹';
    }

    function updateReadouts(maxYB, optT) {
      const peakEl = document.getElementById('peak-yield-val');
      const optEl = document.getElementById('opt-temp-val');
      if (peakEl) peakEl.textContent = maxYB.toFixed(3);
      if (optEl) optEl.textContent = `${optT} K`;
    }

    function applySeriesColors(t) {
      const cXA = t.series[0];
      const cYB = t.series[2];
      const cSB = t.series[7];

      const dotXA = document.getElementById('legend-dot-xa');
      const dotYB = document.getElementById('legend-dot-yb');
      const dotSB = document.getElementById('legend-dot-sb');
      if (dotXA) dotXA.style.backgroundColor = cXA;
      if (dotYB) dotYB.style.backgroundColor = cYB;
      if (dotSB) dotSB.style.backgroundColor = cSB;

      return { cXA, cYB, cSB };
    }

    function showErrorFallback(containerId, error) {
      console.error(`Render error in ${containerId}:`, error);
      const container = document.getElementById(containerId);
      if (container) {
        const reason = String((error && error.message) || error || 'unknown').replaceAll('"', "'").slice(0, 160);
        if (container) container.innerHTML = `
          <div class="error-fallback-card" data-error="${reason}" style="padding: var(--lumi-sys-spacing--l, 16px); background: var(--lumi-sys-color--surface-dim, #f2f0f0); border-radius: var(--lumi-sys-shape--medium, 12px); text-align: center; color: var(--lumi-sys-color--on-surface-variant, rgba(0,0,0,0.62));">
            <p style="margin: 0;" class="lumi-body-m">Data Unavailable</p>
            <p style="margin: 4px 0 0 0;" class="lumi-body-s">Unable to render visualization module.</p>
          </div>`;
      }
    }

    function initCharts() {
      const canvas = document.getElementById('pfrCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const t = getLumiChartTokens();
      const { cXA, cYB, cSB } = applySeriesColors(t);

      Chart.defaults.font.family = t.fontFamily;
      Chart.defaults.color = t.deEmphasisColor;
      Chart.defaults.animation.duration = 0;
      Chart.defaults.transitions.active.animation.duration = 150;

      const initial = computeKinetics(state.E1, state.E2, state.tau);
      latestMetrics = initial.metrics;
      updateReadouts(initial.maxYB, initial.optT);

      pfrChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: TEMPS,
          datasets: [
            {
              label: 'Conversion (XA)',
              data: initial.xaArr,
              borderColor: cXA,
              backgroundColor: cXA,
              borderWidth: 2.5,
              tension: 0.25,
              pointRadius: 0,
              pointHoverRadius: 6,
              pointHoverBorderWidth: 2.5,
              pointHoverBorderColor: cXA,
              pointHoverBackgroundColor: t.surfaceColor,
              clip: false
            },
            {
              label: 'Yield (YB)',
              data: initial.ybArr,
              borderColor: cYB,
              backgroundColor: cYB,
              borderWidth: 2.5,
              tension: 0.25,
              pointRadius: 0,
              pointHoverRadius: 6,
              pointHoverBorderWidth: 2.5,
              pointHoverBorderColor: cYB,
              pointHoverBackgroundColor: t.surfaceColor,
              clip: false
            },
            {
              label: 'Selectivity (SB)',
              data: initial.sbArr,
              borderColor: cSB,
              backgroundColor: cSB,
              borderWidth: 2.5,
              tension: 0.25,
              pointRadius: 0,
              pointHoverRadius: 6,
              pointHoverBorderWidth: 2.5,
              pointHoverBorderColor: cSB,
              pointHoverBackgroundColor: t.surfaceColor,
              clip: false
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: {
            mode: 'index',
            intersect: false
          },
          layout: {
            padding: { top: 12, right: 16, bottom: 4, left: 4 }
          },
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: t.surfaceColor,
              titleColor: t.textColor,
              bodyColor: t.deEmphasisColor,
              footerColor: t.deEmphasisColor,
              borderColor: t.gridColor,
              borderWidth: 1,
              cornerRadius: 12,
              padding: 12,
              titleFont: { family: t.monoFamily, size: 13, weight: '500', style: 'normal' },
              bodyFont: { family: t.monoFamily, size: 12, weight: '400', style: 'normal' },
              footerFont: { family: t.monoFamily, size: 12, weight: '400', style: 'italic' },
              callbacks: {
                title: function(items) {
                  if (!items || !items.length) return '';
                  const idx = items[0].dataIndex;
                  return `Temperature T = ${TEMPS[idx]} K`;
                },
                label: function(ctx) {
                  const val = ctx.parsed.y;
                  return ` ${ctx.dataset.label}: ${val.toFixed(4)}`;
                },
                footer: function(items) {
                  if (!items || !items.length) return '';
                  const m = latestMetrics[items[0].dataIndex];
                  if (!m) return '';
                  return `k₁ = ${formatRateConstant(m.k1)}   k₂ = ${formatRateConstant(m.k2)}`;
                }
              }
            }
          },
          scales: {
            x: {
              grid: { display: false },
              border: { display: false },
              title: {
                display: true,
                text: 'Reaction Temperature T [K]',
                color: t.deEmphasisColor,
                font: { family: t.fontFamily, size: 13, weight: '400', style: 'normal' },
                padding: { top: 4 }
              },
              ticks: {
                padding: 8,
                color: t.textColor,
                font: { family: t.monoFamily, size: 12, weight: '400', style: 'italic' },
                autoSkip: false,
                maxRotation: 0,
                callback: function(val, index) {
                  const temp = TEMPS[index];
                  return temp % 50 === 0 ? temp : '';
                }
              }
            },
            y: {
              min: 0,
              max: 1.0,
              grace: '5%',
              grid: {
                color: t.gridColor,
                drawBorder: false
              },
              border: { display: false },
              title: {
                display: true,
                text: 'Dimensionless Fraction',
                color: t.deEmphasisColor,
                font: { family: t.fontFamily, size: 13, weight: '400', style: 'normal' },
                padding: { bottom: 4 }
              },
              ticks: {
                padding: 8,
                stepSize: 0.25,
                maxTicksLimit: 5,
                color: t.textColor,
                font: { family: t.monoFamily, size: 12, weight: '400', style: 'italic' },
                callback: function(value) {
                  return Number(value).toFixed(2);
                }
              }
            }
          }
        }
      });

      enableChartKeyboardA11y(pfrChart);
      updateViz();
    }

    function updateViz() {
      const res = computeKinetics(state.E1, state.E2, state.tau);
      latestMetrics = res.metrics;
      updateReadouts(res.maxYB, res.optT);

      if (!pfrChart) return;

      const t = getLumiChartTokens();
      const { cXA, cYB, cSB } = applySeriesColors(t);

      pfrChart.data.datasets[0].data = res.xaArr;
      pfrChart.data.datasets[0].borderColor = cXA;
      pfrChart.data.datasets[0].backgroundColor = cXA;
      pfrChart.data.datasets[0].pointHoverBorderColor = cXA;
      pfrChart.data.datasets[0].pointHoverBackgroundColor = t.surfaceColor;

      pfrChart.data.datasets[1].data = res.ybArr;
      pfrChart.data.datasets[1].borderColor = cYB;
      pfrChart.data.datasets[1].backgroundColor = cYB;
      pfrChart.data.datasets[1].pointHoverBorderColor = cYB;
      pfrChart.data.datasets[1].pointHoverBackgroundColor = t.surfaceColor;

      pfrChart.data.datasets[2].data = res.sbArr;
      pfrChart.data.datasets[2].borderColor = cSB;
      pfrChart.data.datasets[2].backgroundColor = cSB;
      pfrChart.data.datasets[2].pointHoverBorderColor = cSB;
      pfrChart.data.datasets[2].pointHoverBackgroundColor = t.surfaceColor;

      pfrChart.options.scales.x.ticks.color = t.textColor;
      pfrChart.options.scales.x.title.color = t.deEmphasisColor;
      pfrChart.options.scales.y.ticks.color = t.textColor;
      pfrChart.options.scales.y.title.color = t.deEmphasisColor;
      pfrChart.options.scales.y.grid.color = t.gridColor;

      pfrChart.options.plugins.tooltip.backgroundColor = t.surfaceColor;
      pfrChart.options.plugins.tooltip.titleColor = t.textColor;
      pfrChart.options.plugins.tooltip.bodyColor = t.deEmphasisColor;
      pfrChart.options.plugins.tooltip.footerColor = t.deEmphasisColor;
      pfrChart.options.plugins.tooltip.borderColor = t.gridColor;

      pfrChart.update('none');
    }

    function bindSlider(sliderId, stateKey, unit) {
      const slider = document.getElementById(sliderId);
      const valEl = document.getElementById(`${sliderId}-val`);
      if (!slider) return;
      slider.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        state[stateKey] = val;
        const pct = ((val - parseFloat(slider.min)) / (parseFloat(slider.max) - parseFloat(slider.min))) * 100;
        slider.style.setProperty('--progress', pct.toFixed(2) + '%');
        if (valEl) valEl.textContent = `${val} ${unit}`;
        updateViz();
      });
    }

    bindSlider('slider-e1', 'E1', 'kJ/mol');
    bindSlider('slider-e2', 'E2', 'kJ/mol');
    bindSlider('slider-tau', 'tau', 's');

    function whenReady(globalName, init, zoneId, tries = 100) {
      if (typeof window[globalName] !== 'undefined') {
        Promise.resolve().then(init).catch(err => showErrorFallback(zoneId, err));
        return;
      }
      if (tries <= 0) {
        showErrorFallback(zoneId, new Error(globalName + ' failed to load'));
        return;
      }
      setTimeout(() => whenReady(globalName, init, zoneId, tries - 1), 30);
    }

    whenReady('Chart', () => document.fonts.ready.then(initCharts), 'chart-zone');

    const applyTheme = t => {
      document.documentElement.setAttribute('data-theme', t);
      if (typeof updateViz === 'function') updateViz();
    };
    if (!document.documentElement.hasAttribute('data-theme') && window.matchMedia?.('(prefers-color-scheme: dark)').matches) applyTheme('dark');
    window.addEventListener('message', e => {
      if (e.data?.type === 'set-theme' || e.data?.type === 'APPLY_THEME') applyTheme(e.data.theme);
    });
    (function autoResize() {
      function notifyHeight() {
        const root = document.querySelector('.widget-container') || document.body;
        const h = Math.ceil(Math.max(root.getBoundingClientRect().bottom, root.scrollHeight));
        window.parent.postMessage({ type: 'widget-resize', height: h }, '*');
      }
      window.addEventListener('load', () => setTimeout(notifyHeight, 120));
      new ResizeObserver(notifyHeight).observe(document.documentElement);
    })();
  </script>
