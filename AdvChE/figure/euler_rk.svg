<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <!-- 背景 -->
  <rect width="800" height="450" fill="#f8fafc" rx="10" />
  
  <!-- スタイル設定 -->
  <style>
    .axis { stroke: #334155; stroke-width: 2; marker-end: url(#arrow); }
    .true-curve { fill: none; stroke: #94a3b8; stroke-width: 3; stroke-dasharray: 6; }
    .euler-line { fill: none; stroke: #ef4444; stroke-width: 3; }
    .rk-line { fill: none; stroke: #3b82f6; stroke-width: 3; }
    .point { fill: #1e293b; }
    .label { font-family: sans-serif; font-size: 14px; fill: #1e293b; }
    .title { font-family: sans-serif; font-size: 18px; font-weight: bold; fill: #1e293b; }
    .subtitle { font-family: sans-serif; font-size: 16px; font-weight: bold; }
    .annotation { font-family: sans-serif; font-size: 12px; fill: #64748b; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155" />
    </marker>
  </defs>

  <!-- 全体タイトル -->
  <text x="400" y="35" text-anchor="middle" class="title">オイラー法 vs ルンゲ＝クッタ法（RK4）の予測メカニズム</text>

  <!-- 左側：オイラー法 -->
  <g transform="translate(50, 60)">
    <rect x="0" y="0" width="320" height="360" fill="#ffffff" stroke="#cbd5e1" rx="8" />
    <text x="160" y="30" text-anchor="middle" class="subtitle" fill="#ef4444">オイラー法（単純・ズレやすい）</text>
    
    <!-- グラフエリア -->
    <g transform="translate(40, 60)">
      <!-- 軸 -->
      <line x1="0" y1="240" x2="260" y2="240" class="axis" />
      <line x1="0" y1="240" x2="0" y2="20" class="axis" />
      <text x="250" y="260" class="label">t</text>
      <text x="-20" y="30" class="label">C</text>

      <!-- 真の曲線（理想） -->
      <path d="M 0 200 Q 100 180 240 60" class="true-curve" />
      
      <!-- オイラー法の予測直線 -->
      <line x1="0" y1="200" x2="240" y2="80" class="euler-line" />

      <!-- 点とラベル -->
      <circle cx="0" cy="200" r="5" class="point" />
      <text x="-15" y="205" class="label" font-size="12">tₙ</text>

      <circle cx="240" cy="80" r="5" fill="#ef4444" />
      <text x="180" y="70" class="annotation" fill="#ef4444">予測地点（ズレる）</text>
      
      <!-- 誤差の表示 -->
      <line x1="240" y1="80" x2="240" y2="107" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="2" />
      <text x="150" y="100" class="annotation" fill="#ef4444">誤差大</text>

      <text x="15" y="230" class="annotation">今の傾きだけで一気に突っ走る！</text>
    </g>
  </g>

  <!-- 右側：RK4 -->
  <g transform="translate(430, 60)">
    <rect x="0" y="0" width="320" height="360" fill="#ffffff" stroke="#cbd5e1" rx="8" />
    <text x="160" y="30" text-anchor="middle" class="subtitle" fill="#3b82f6">ルンゲ＝クッタ法 (RK4・高精度)</text>
    
    <!-- グラフエリア -->
    <g transform="translate(40, 60)">
      <!-- 軸 -->
      <line x1="0" y1="240" x2="260" y2="240" class="axis" />
      <line x1="0" y1="240" x2="0" y2="20" class="axis" />
      <text x="250" y="260" class="label">t</text>
      <text x="-20" y="30" class="label">C</text>

      <!-- 真の曲線（理想）とぴったり重なる軌跡 -->
      <path d="M 0 200 Q 100 180 240 60" class="true-curve" />
      <path d="M 0 200 Q 100 180 240 60" class="rk-line" />

      <!-- 点と中間傾きのイメージ -->
      <circle cx="0" cy="200" r="5" class="point" />
      <text x="-15" y="205" class="label" font-size="12">tₙ</text>

      <circle cx="80" cy="175" r="3" fill="#3b82f6" />
      <circle cx="160" cy="130" r="3" fill="#3b82f6" />
      <circle cx="240" cy="60" r="5" fill="#3b82f6" />
      
      <text x="110" y="115" class="annotation" fill="#3b82f6">4つの傾きを平均化</text>

      <text x="15" y="230" class="annotation">途中で何度もテスト走行して修正！</text>
    </g>
  </g>
</svg>