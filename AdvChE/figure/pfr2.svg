<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" width="100%" height="100%">
  <defs>
    <!-- 矢印の定義 -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#00008b" />
    </marker>
    <!-- 微小要素の斜線ハッチングパターン -->
    <pattern id="hatch" width="6" height="6" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#00008b" stroke-width="1.2" />
    </pattern>
  </defs>

  <style>
    .draw-line { stroke: #00008b; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .dashed-line { stroke: #00008b; stroke-width: 2; fill: none; stroke-dasharray: 4,4; }
    .arrow-line { stroke: #00008b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .text { font-family: 'Cambria Math', 'Times New Roman', serif; font-size: 22px; font-style: italic; fill: #00008b; }
    .sub { font-size: 15px; font-style: italic; }
  </style>

  <!-- 円筒の外枠（上下の直線） -->
  <line x1="130" y1="50" x2="520" y2="50" class="draw-line" />
  <line x1="130" y1="170" x2="520" y2="170" class="draw-line" />

  <!-- 左端の楕円 -->
  <ellipse cx="130" cy="110" rx="20" ry="60" class="draw-line" />

  <!-- 右端の曲線（手前側） -->
  <path d="M 520,50 A 20,60 0 0,1 520,170" class="draw-line" />

  <!-- 微小要素 dV (スライス部分) -->
  <!-- 背面の破線 -->
  <path d="M 300,50 A 18,60 0 0,0 300,170" class="dashed-line" />
  <!-- ハッチング領域 -->
  <path d="M 300,50 A 18,60 0 0,1 300,170 L 330,170 A 18,60 0 0,0 330,50 Z" fill="url(#hatch)" />
  <!-- 前面の境界線 -->
  <path d="M 300,50 A 18,60 0 0,1 300,170" class="draw-line" />
  <path d="M 330,50 A 18,60 0 0,1 330,170" class="draw-line" />
  <path d="M 330,50 A 18,60 0 0,0 330,170" class="dashed-line" />

  <!-- 矢印とテキスト -->
  <!-- F_j,0 -->
  <line x1="50" y1="110" x2="110" y2="110" class="arrow-line" />
  <text x="20" y="118" class="text">F<tspan baseline-shift="sub" class="sub">j,0</tspan></text>

  <!-- F_j -->
  <line x1="210" y1="110" x2="260" y2="110" class="arrow-line" />
  <text x="175" y="118" class="text">F<tspan baseline-shift="sub" class="sub">j</tspan></text>

  <!-- F_j + dF_j -->
  <line x1="345" y1="110" x2="385" y2="110" class="arrow-line" />
  <text x="395" y="118" class="text">F<tspan baseline-shift="sub" class="sub">j</tspan> + dF<tspan baseline-shift="sub" class="sub">j</tspan></text>

  <!-- F_j,f -->
  <line x1="535" y1="110" x2="585" y2="110" class="arrow-line" />
  <text x="595" y="118" class="text">F<tspan baseline-shift="sub" class="sub">j,f</tspan></text>

  <!-- 下部の幅と dV 指定 -->
  <line x1="300" y1="185" x2="330" y2="185" class="draw-line" />
  <line x1="300" y1="178" x2="300" y2="192" class="draw-line" />
  <line x1="330" y1="178" x2="330" y2="192" class="draw-line" />
  <text x="298" y="218" class="text">dV</text>
</svg>

