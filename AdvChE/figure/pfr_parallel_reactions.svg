<svg xmlns="http://www.w3.org/2000/svg" width="968" height="228" viewBox="0 0 968 228">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf5ff"/>
      <stop offset="1" stop-color="#d9ecfb"/>
    </linearGradient>
    <linearGradient id="tube" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f7f7"/>
      <stop offset="0.45" stop-color="#c9cdd1"/>
      <stop offset="1" stop-color="#aeb4ba"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#111827"/>
    </marker>
    <style>
      text { font-family: sans-serif; fill: #111827; }
      .bold { font-weight: 700; }
      .main { font-size: 22px; }
      .label { font-size: 18px; }
      .small { font-size: 16px; }
      .math { font-family: serif; font-style: italic; }
      .line { stroke: #111827; stroke-width: 2; fill: none; }
    </style>
  </defs>
  <!-- Left reaction panel -->
  <rect x="3" y="1" width="253" height="226" rx="3" fill="url(#panel)" stroke="#83c5ff" stroke-width="1.2"/>
  <text x="17" y="28" class="main bold">反応系</text>
  <text x="60" y="72" class="main bold">A</text>
  <line x1="99" y1="61" x2="160" y2="61" class="line" marker-end="url(#arrow)"/>
  <text x="121" y="47" class="label math bold">r₁</text>
  <text x="180" y="72" class="main bold">B</text>
  <text x="60" y="123" class="main bold">A</text>
  <line x1="99" y1="112" x2="160" y2="112" class="line" marker-end="url(#arrow)"/>
  <text x="121" y="98" class="label math bold">r₂</text>
  <text x="180" y="123" class="main bold">C</text>
  <text x="61" y="161" class="label">A：反応物質</text>
  <text x="61" y="188" class="label">B：目的生成物質</text>
  <text x="61" y="215" class="label">C：副生成物</text>

  <!-- Reactor title -->
  <text x="529" y="30" text-anchor="middle" class="main bold">PFR（プラグフロー反応器）</text>
  <!-- Feed -->
  <text x="319" y="88" text-anchor="middle" class="label math">Fₐ₀</text>
  <text x="319" y="116" text-anchor="middle" class="label">（Aのみ）</text>
  <line x1="365" y1="101" x2="417" y2="101" class="line" marker-end="url(#arrow)"/>
  <!-- PFR tube with elliptical end caps -->
  <rect x="430" y="62" width="250" height="80" fill="url(#tube)" stroke="#374151" stroke-width="1.8"/>
  <ellipse cx="430" cy="102" rx="13" ry="40" fill="url(#tube)" stroke="#374151" stroke-width="1.8"/>
  <path d="M680 62 C696 62 696 142 680 142" fill="none" stroke="#374151" stroke-width="1.8"/>
  <text x="555" y="109" text-anchor="middle" class="main bold">PFR</text>
  <!-- Outlet -->
  <line x1="696" y1="101" x2="746" y2="101" class="line" marker-end="url(#arrow)"/>
  <text x="799" y="95" text-anchor="middle" class="label math">Fₐ、Fᵦ、F꜀</text>
  <text x="799" y="124" text-anchor="middle" class="label">（反応後）</text>
  <!-- Axial coordinate -->
  <line x1="427" y1="172" x2="670" y2="172" class="line" marker-end="url(#arrow)"/>
  <text x="427" y="195" text-anchor="middle" class="small">0</text>
  <text x="548" y="198" text-anchor="middle" class="label">反応器長さ（位置）</text>
  <text x="637" y="193" class="label math">z</text>
  <text x="671" y="195" class="label math">L</text>
</svg>
