<text x="846" y="265" font-size="20" fill="#1674ff" font-weight="700">F<tspan baseline-shift="sub" font-size="13">A</tspan> (消費)</text><text x="1169" y="314" font-size="19" fill="#ff2424" font-weight="700">F<tspan baseline-shift="sub" font-size="13">B</tspan> (生成)</text><text x="1169" y="370" font-size="19" fill="#00a765" font-weight="700">F<tspan baseline-shift="sub" font-size="13">C</tspan> (生成)</text><text x="1190" y="401" font-size="19" fill="#ff9900" font-style="italic" font-weight="700">S<tspan baseline-shift="sub" font-size="13">B/C</tspan></text>
<!-- right explanatory box -->
<rect x="714" y="503" width="647" height="113" rx="8" fill="url(#paleOrange)" stroke="#ff9a40" stroke-width="1.5"/>
<text x="736" y="532" font-size="20" fill="#e75b00" font-weight="700">総括選択率　<tspan font-style="italic">S</tspan><tspan baseline-shift="sub" font-size="14">B/C</tspan> の意味</text>
<text class="jp" x="738" y="567" font-size="17">•　反応器出口での B と C の生成量の比を表す。</text><text class="jp" x="738" y="597" font-size="17">•　目的生成物 B の収率・純度の評価に用いられる。</text>
</svg>
