<text x="41" y="389" font-size="19" font-weight="700" fill="#8127b8">瞬間収率</text><text x="141" y="389" class="eq" fill="#8127b8">Y′</text><text x="161" y="395" font-size="12" font-family="serif" font-style="italic" fill="#8127b8">B</text><text x="180" y="389" class="eq" fill="#8127b8">=</text><text x="214" y="375" class="eq" fill="#8127b8">r</text><text x="231" y="381" font-size="12" font-family="serif" font-style="italic" fill="#8127b8">B</text><path d="M207 384h43" stroke="#8127b8" stroke-width="1.3"/><text x="213" y="405" class="eq" fill="#8127b8">−r</text><text x="239" y="409" font-size="12" font-family="serif" font-style="italic" fill="#8127b8">A</text>
<text x="42" y="428" class="body">反応器内のある位置 z における</text><text x="42" y="449" class="body">生成速度と消費速度の比。</text><text x="42" y="472" class="body">この並列反応（速度定数一定）の場合、</text><text x="42" y="493" class="body">瞬間収率は反応器内で一定となる。</text>
<rect x="482" y="355" width="424" height="149" rx="5" fill="url(#orangebg)" stroke="#ffbb38" stroke-width="1.3"/>
<text x="508" y="389" font-size="19" font-weight="700" fill="#ed6500">総括収率</text><text x="614" y="389" class="eq" fill="#ed6500">Y</text><text x="632" y="395" font-size="12" font-family="serif" font-style="italic" fill="#ed6500">B</text><text x="650" y="389" class="eq" fill="#ed6500">=</text><text x="685" y="375" class="eq" fill="#ed6500">F</text><text x="702" y="381" font-size="12" font-family="serif" font-style="italic" fill="#ed6500">B</text><text x="715" y="375" class="eq" fill="#ed6500">− F</text><text x="761" y="381" font-size="12" font-family="serif" font-style="italic" fill="#ed6500">B0</text><path d="M680 384h104" stroke="#ed6500" stroke-width="1.3"/><text x="721" y="405" class="eq" fill="#ed6500">F</text><text x="738" y="411" font-size="12" font-family="serif" font-style="italic" fill="#ed6500">A0</text>
<text x="508" y="428" class="body">反応器出口での生成物 B の流量（モル流量）</text><text x="508" y="449" class="body">を、原料 A の供給流量（モル流量）で割ったもの。</text><text x="508" y="477" class="body">反応器の長さとともに増加し、出口で一定値に近づく。</text>
