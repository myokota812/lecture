<svg xmlns="http://www.w3.org/2000/svg"
     width="900"
     height="420"
     viewBox="0 0 900 420">

  <!-- タイトル -->
  <text x="120"
        y="55"
        font-size="28"
        font-family="Arial"
        font-weight="bold">
    General Material Balance
  </text>

  <!-- 制御体積 -->
  <rect x="250"
        y="100"
        width="400"
        height="180"
        fill="white"
        stroke="black"
        stroke-width="3"/>

  <!-- 流入 -->
  <line x1="60"
        y1="190"
        x2="250"
        y2="190"
        stroke="black"
        stroke-width="4"/>

  <polygon points="250,190 230,180 230,200"
           fill="black"/>

  <!-- 流出 -->
  <line x1="650"
        y1="190"
        x2="840"
        y2="190"
        stroke="black"
        stroke-width="4"/>

  <polygon points="840,190 820,180 820,200"
           fill="black"/>



  <!-- 制御体積ラベル -->
  <text x="355"
        y="95"
        font-size="24"
        font-family="Arial">
    Control Volume,V
  </text>

  <!-- 流入ラベル -->
  <text x="70"
        y="165"
        font-size="22"
        font-family="Arial">
    Inlet
  </text>

  <text x="150"
        y="165"
        font-size="24">
    F
    <tspan dy="6" font-size="16">i0</tspan>
  </text>

  <!-- 流出ラベル -->
  <text x="670"
        y="165"
        font-size="22"
        font-family="Arial">
    Outlet
  </text>

  <text x="750"
        y="165"
        font-size="24">
    F
    <tspan dy="6" font-size="16">i</tspan>
  </text>

  <!-- 反応生成 -->
  <text x="285"
        y="155"
        font-size="22"
        font-family="Arial">
    Generation(+)/Consumption(-)
  </text>

  <text x="500"
        y="185"
        font-size="22"
        font-family="Arial">
    r
    <tspan dy="6" font-size="16">i</tspan>
  </text>
  <text x="520"
        y="185"
        font-size="22"
        font-family="Arial">
    V
  </text>

  <!-- 蓄積 -->
  <text x="285"
        y="240"
        font-size="22"
        font-family="Arial">
    Accumulation
  </text>

  <text x="485"
        y="240"
        font-size="22"
        font-family="Arial">
    dN
    <tspan dy="6" font-size="16">i</tspan>
  </text>
  <text x="525"
        y="240"
        font-size="22"
        font-family="Arial">
    /dt
  </text>

  <!-- 基本式 -->
  <text x="110"
        y="390"
        font-size="26"
        font-family="Arial">
    Accumulation = In − Out + (+)Generation/(-)consumption
  </text>

</svg>
