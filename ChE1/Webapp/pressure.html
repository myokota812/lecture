<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>圧力差が流れを生み出す</title>

<style>

body{
    font-family:sans-serif;
    background:#ececec;
    text-align:center;
}

h1{
    margin-top:15px;
}

.controls{
    width:650px;
    margin:auto;
}

.row{
    margin:15px;
}

label{
    display:inline-block;
    width:220px;
    text-align:right;
    font-size:20px;
}

input[type=range]{
    width:250px;
}

.value{
    display:inline-block;
    width:70px;
    color:#003366;
    font-weight:bold;
}

#flowText{
    margin:20px;
    font-size:24px;
    font-weight:bold;
}

.red{
    color:#d00000;
}

.blue{
    color:#0044ff;
}

svg{
    background:white;
    border:1px solid #ccc;
}

</style>
</head>
<body>

<h1>圧力差が流れを生み出す</h1>

<div class="controls">

<div class="row">
<label>入口圧力 P₁ [kPa]</label>
<input type="range"
id="P1"
min="0"
max="300"
value="200">
<span id="P1v" class="value"></span>
</div>

<div class="row">
<label>出口圧力 P₂ [kPa]</label>
<input type="range"
id="P2"
min="0"
max="300"
value="100">
<span id="P2v" class="value"></span>
</div>

<div class="row">
<label>配管長 L [m]</label>
<input type="range"
id="L"
min="1"
max="100"
value="10">
<span id="Lv" class="value"></span>
</div>

<div class="row">
<label>管半径 R [cm]</label>
<input type="range"
id="R"
min="1"
max="20"
value="5">
<span id="Rv" class="value"></span>
</div>

<div class="row">
<label>摩擦係数 f [-]</label>
<input type="range"
id="f"
min="0.01"
max="0.10"
step="0.001"
value="0.03">
<span id="fv" class="value"></span>
</div>

</div>

<div id="flowText"></div>

<svg width="1200" height="360">

<defs>

<linearGradient id="grad"
x1="0%" y1="0%"
x2="100%" y2="0%">

<stop offset="0%" stop-color="#ff4040"/>
<stop offset="100%" stop-color="#4b7cff"/>

</linearGradient>

<marker id="arrow"
markerWidth="12"
markerHeight="12"
refX="10"
refY="6"
orient="auto">

<path d="M0,0 L12,6 L0,12 Z"
fill="#222"/>

</marker>

</defs>

<text
id="deltaP"
x="600"
y="50"
text-anchor="middle"
font-size="34"
font-weight="bold">
</text>

<text
id="velocityLabel"
x="600"
y="120"
text-anchor="middle"
font-size="24">
</text>

<!-- 配管 -->

<rect
x="150"
y="150"
width="900"
height="90"
rx="25"
fill="url(#grad)"
stroke="#444"
stroke-width="2"/>

<!-- 流速ベクトル -->

<line
id="flowArrow"
stroke="#222"
stroke-width="8"
marker-end="url(#arrow)"
y1="195"
y2="195"/>

<!-- 左圧力 -->

<circle
cx="150"
cy="195"
r="46"
fill="#ffdcdc"
stroke="#333"/>

<text
id="leftP"
x="150"
y="205"
text-anchor="middle"
font-size="18">
</text>

<!-- 右圧力 -->

<circle
cx="1050"
cy="195"
r="46"
fill="#dde7ff"
stroke="#333"/>

<text
id="rightP"
x="1050"
y="205"
text-anchor="middle"
font-size="18">
</text>

<text
id="leftLabel"
x="150"
y="290"
text-anchor="middle"
font-size="20"
fill="red">
</text>

<text
id="rightLabel"
x="1050"
y="290"
text-anchor="middle"
font-size="20"
fill="blue">
</text>

<g id="pressureTicks"></g>

</svg>

<script>

const rho = 1000;

function update(){

const P1 =
Number(document.getElementById("P1").value);

const P2 =
Number(document.getElementById("P2").value);

const L =
Number(document.getElementById("L").value);

const R =
Number(document.getElementById("R").value)/100;

const f =
Number(document.getElementById("f").value);

const D = 2*R;

const deltaP =
(P1-P2)*1000;

let v = 0;

if(Math.abs(deltaP)>1){

    v =
    Math.sqrt(
    2*Math.abs(deltaP)*D /
    (rho*f*L)
    );
}

const area =
Math.PI*R*R;

const Q =
area*v*
Math.sign(deltaP);

document.getElementById("P1v").innerHTML=P1;
document.getElementById("P2v").innerHTML=P2;
document.getElementById("Lv").innerHTML=L;
document.getElementById("Rv").innerHTML=(R*100).toFixed(0);
document.getElementById("fv").innerHTML=f.toFixed(3);

document.getElementById("deltaP").innerHTML =
`ΔP = ${(deltaP/1000).toFixed(1)} kPa`;

document.getElementById("velocityLabel").innerHTML =
`平均流速 v = ${v.toFixed(2)} m/s`;

let state="";

if(deltaP>0){

state=
"高圧側→低圧側へ流れる";

}
else if(deltaP<0){

state=
"逆流（右→左）";

}
else{

state=
"流れなし";

}

document.getElementById("flowText").innerHTML=
`
流量 Q = <span class="red">
${Q.toFixed(3)}
</span> m³/s　
（${state}）
`;

document.getElementById("leftP").textContent=
P1+" kPa";

document.getElementById("rightP").textContent=
P2+" kPa";

const arrow =
document.getElementById("flowArrow");

if(Math.abs(deltaP)<1){

arrow.style.visibility="hidden";

}
else{

arrow.style.visibility="visible";

const len=
80 + 180*Math.sqrt(v);

const cx=600;

if(deltaP>0){

arrow.setAttribute(
"x1",
cx-len/2
);

arrow.setAttribute(
"x2",
cx+len/2
);

}
else{

arrow.setAttribute(
"x1",
cx+len/2
);

arrow.setAttribute(
"x2",
cx-len/2
);

}

}

if(P1>P2){

document.getElementById("leftLabel")
.innerHTML="高圧側";

document.getElementById("rightLabel")
.innerHTML="低圧側";

}
else if(P1<P2){

document.getElementById("leftLabel")
.innerHTML="低圧側";

document.getElementById("rightLabel")
.innerHTML="高圧側";

}
else{

document.getElementById("leftLabel")
.innerHTML="同圧";

document.getElementById("rightLabel")
.innerHTML="同圧";

}

const g =
document.getElementById("pressureTicks");

g.innerHTML="";

for(let i=0;i<=5;i++){

const x=
200+i*160;

const P=
P1+(P2-P1)*i/5;

const line=
document.createElementNS(
"http://www.w3.org/2000/svg",
"line"
);

line.setAttribute("x1",x);
line.setAttribute("x2",x);
line.setAttribute("y1",150);
line.setAttribute("y2",240);
line.setAttribute("stroke","white");
line.setAttribute("stroke-width","2");

g.appendChild(line);

const txt=
document.createElementNS(
"http://www.w3.org/2000/svg",
"text"
);

txt.setAttribute("x",x);
txt.setAttribute("y",265);
txt.setAttribute("text-anchor","middle");
txt.setAttribute("font-size","14");

txt.textContent=
P.toFixed(0)+" kPa";

g.appendChild(txt);

}

}

document
.querySelectorAll("input")
.forEach(
s=>s.addEventListener(
"input",
update
));

update();

</script>

</body>
</html>
