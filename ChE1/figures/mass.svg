<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1000" height="450"
     viewBox="0 0 1000 450">

  <defs>
    <marker id="arrow"
            markerWidth="10"
            markerHeight="10"
            refX="8"
            refY="3"
            orient="auto">
      <path d="M0,0 L8,3 L0,6 Z"
            fill="#1565C0"/>
    </marker>
  </defs>

  <!-- 配管 -->

  <path d="
      M150 120
      L450 120
      L650 180
      L850 180"
      fill="none"
      stroke="#1B5E20"
      stroke-width="4"/>

  <path d="
      M150 330
      L450 330
      L650 270
      L850 270"
      fill="none"
      stroke="#1B5E20"
      stroke-width="4"/>

  <!-- 流線 -->

  <line x1="60" y1="170" x2="130" y2="170"
        stroke="#1565C0" stroke-width="3"
        marker-end="url(#arrow)"/>

  <line x1="60" y1="225" x2="130" y2="225"
        stroke="#1565C0" stroke-width="3"
        marker-end="url(#arrow)"/>

  <line x1="60" y1="280" x2="130" y2="280"
        stroke="#1565C0" stroke-width="3"
        marker-end="url(#arrow)"/>

  <line x1="870" y1="190" x2="950" y2="190"
        stroke="#1565C0" stroke-width="3"
        marker-end="url(#arrow)"/>

  <line x1="870" y1="225" x2="950" y2="225"
        stroke="#1565C0" stroke-width="3"
        marker-end="url(#arrow)"/>

  <line x1="870" y1="260" x2="950" y2="260"
        stroke="#1565C0" stroke-width="3"
        marker-end="url(#arrow)"/>

  <!-- 断面1 -->

  <line x1="300" y1="90" x2="300" y2="360"
        stroke="black"
        stroke-width="2"
        stroke-dasharray="8,6"/>

  <text x="255" y="60"
        font-size="28"
        font-family="serif">
        断面1
  </text>

  <!-- 断面2 -->

  <line x1="760" y1="160" x2="760" y2="290"
        stroke="black"
        stroke-width="2"
        stroke-dasharray="8,6"/>

  <text x="715" y="130"
        font-size="28"
        font-family="serif">
        断面2
  </text>

  <!-- ラベル -->

  <text x="210" y="390"
        font-size="26"
        font-family="serif">
        A₁, u₁, ρ₁
  </text>

  <text x="650" y="390"
        font-size="26"
        font-family="serif">
        A₂, u₂, ρ₂
  </text>

  <text x="180" y="425"
        font-size="24"
        font-family="serif">
        ṁ₁ = ρ₁A₁u₁
  </text>

  <text x="620" y="425"
        font-size="24"
        font-family="serif">
        ṁ₂ = ρ₂A₂u₂
  </text>

  <!-- 質量保存 -->

  <text x="350" y="35"
        font-size="30"
        font-family="serif"
        font-weight="bold">
        定常流れ： ṁ₁ = ṁ₂
  </text>

</svg>