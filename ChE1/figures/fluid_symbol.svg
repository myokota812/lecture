<svg xmlns="http://www.w3.org/2000/svg"
     width="900" height="350"
     viewBox="0 0 900 350">

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8"
            refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="black"/>
    </marker>
  </defs>

  <style>
    .label {
      font-family: serif;
      font-size: 24px;
    }

    .pipe {
      fill: none;
      stroke: black;
      stroke-width: 2.5;
    }

    .arrow {
      fill: none;
      stroke: black;
      stroke-width: 2;
      marker-end: url(#arrow);
    }

    .dash {
      fill: none;
      stroke: black;
      stroke-width: 2;
      stroke-dasharray: 6 4;
    }
  </style>

  <!-- 配管 -->
  <line x1="250" y1="100" x2="600" y2="100" class="pipe"/>
  <line x1="250" y1="250" x2="600" y2="250" class="pipe"/>

  <!-- 左端 -->
  <ellipse cx="250" cy="175" rx="30" ry="75" class="pipe"/>

  <!-- 右端 -->
  <ellipse cx="600" cy="175" rx="30" ry="75" class="dash"/>

  <!-- 流入矢印 -->
  <line x1="120" y1="175" x2="220" y2="175" class="arrow"/>

  <!-- 管内流れ -->
  <g stroke="steelblue"
     stroke-width="2"
     fill="none"
     marker-end="url(#arrow)">
    <line x1="380" y1="120" x2="410" y2="120"/>
    <line x1="380" y1="140" x2="430" y2="140"/>
    <line x1="380" y1="160" x2="450" y2="160"/>
    <line x1="380" y1="180" x2="450" y2="180"/>
    <line x1="380" y1="200" x2="430" y2="200"/>
    <line x1="380" y1="220" x2="410" y2="220"/>
  </g>

  <!-- 上部説明 -->
  <text x="255" y="50" class="label">
    ρ [kg/m³]
  </text>

  <text x="255" y="300" class="label">
    u [m/s]
  </text>

  <text x="255" y="340" class="label">
    N [kg/(m²·s)]
  </text>

  <!-- 面積 -->
  <text x="640" y="90" class="label">
    A = πD²/4 [m²]
  </text>

  <!-- 直径 -->
<marker id="arrow"
markerWidth="8"
markerHeight="8"
refX="4"
refY="4"
orient="auto-start-reverse">
<path d="M0,0 L8,4 L0,8 Z" fill="black"/>
</marker>

<!-- 直径寸法線 -->
<line x1="680" y1="110"
      x2="680" y2="240"
      stroke="black"
      stroke-width="2"/>

<!-- 上側矢印（外向き） -->
<line x1="680" y1="110"
      x2="680" y2="100"
      stroke="black"
      stroke-width="2"
      marker-end="url(#arrow)"/>

<!-- 下側矢印（外向き） -->
<line x1="680" y1="240"
      x2="680" y2="250"
      stroke="black"
      stroke-width="2"
      marker-end="url(#arrow)"/>

<text x="700" y="185" class="label">
  D [m]
</text>

  <!-- 流量 -->
  <text x="20" y="150" class="label">
    v [m³/s]
  </text>

  <text x="20" y="220" class="label">
    w [kg/s]
  </text>

</svg>
