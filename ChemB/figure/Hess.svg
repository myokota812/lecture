<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 480" width="100%" height="100%">
  <style>
    .axis { stroke: #000; stroke-width: 1.5; fill: none; }
    .level-line { stroke: #000; stroke-width: 1.5; }
    .text-main { font-family: sans-serif; font-size: 18px; font-weight: bold; fill: #000; }
    .text-axis { font-family: sans-serif; font-size: 15px; fill: #000; }
    .text-q1 { font-family: sans-serif; font-size: 18px; font-weight: bold; fill: #0066cc; }
    .text-q2 { font-family: sans-serif; font-size: 18px; font-weight: bold; fill: #009933; }
    .text-q3 { font-family: sans-serif; font-size: 18px; font-weight: bold; fill: #cc0000; }
    
    .line-blue { stroke: #0066cc; stroke-width: 3; fill: none; }
    .fill-blue { fill: #0066cc; }
    .line-green { stroke: #009933; stroke-width: 3; fill: none; }
    .fill-green { fill: #009933; }
    .line-red { stroke: #cc0000; stroke-width: 3; fill: none; }
    .fill-red { fill: #cc0000; }
  </style>

  <!-- 背景 -->
  <rect width="450" height="480" fill="#ffffff" />

  <!-- 縦軸 (エネルギー高) -->
  <line x1="60" y1="430" x2="60" y2="60" class="axis" />
  <polygon points="56,68 60,56 64,68" fill="#000" />
  <text x="35" y="110" class="text-axis">エネルギー高</text>

  <!-- レベル線と物質名 -->
  <!-- 上段: A+B -->
  <line x1="120" y1="100" x2="320" y2="100" class="level-line" />
  <text x="220" y="75" class="text-main" text-anchor="middle">A+B</text>

  <!-- 中段: C+D -->
  <line x1="120" y1="240" x2="250" y2="240" class="level-line" />
  <text x="90" y="246" class="text-main" text-anchor="middle">C+D</text>

  <!-- 下段: AB -->
  <line x1="120" y1="400" x2="320" y2="400" class="level-line" />
  <text x="220" y="385" class="text-main" text-anchor="middle">AB</text>

  <!-- Q1 (青: 上段から中段への両方向矢印) -->
  <line x1="180" y1="112" x2="180" y2="228" class="line-blue" />
  <!-- 上向き矢印（先端） -->
  <polygon points="175,118 185,118 180,108" class="fill-blue" />
  <!-- 下向き矢印（先端） -->
  <polygon points="175,222 185,222 180,232" class="fill-blue" />
  <text x="200" y="180" class="text-q1">Q₁J</text>

  <!-- Q2 (緑: 中段から下段への両方向矢印) -->
  <line x1="180" y1="252" x2="180" y2="388" class="line-green" />
  <!-- 上向き矢印（先端） -->
  <polygon points="175,258 185,258 180,248" class="fill-green" />
  <!-- 下向き矢印（先端） -->
  <polygon points="175,382 185,382 180,392" class="fill-green" />
  <text x="200" y="330" class="text-q2">Q₂J</text>

  <!-- Q3 (赤: 上段から下段への両方向矢印) -->
  <line x1="290" y1="112" x2="290" y2="388" class="line-red" />
  <!-- 上向き矢印（先端） -->
  <polygon points="285,118 295,118 290,108" class="fill-red" />
  <!-- 下向き矢印（先端） -->
  <polygon points="285,382 295,382 290,392" class="fill-red" />
  <text x="315" y="255" class="text-q3">Q₃J</text>

</svg>