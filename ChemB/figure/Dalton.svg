<svg viewBox="0 0 750 500" width="100%" height="100%">
  <!-- 背景 -->
  <rect width="750" height="500" fill="#f8f9fa" />

  <!-- タイトル -->
  <text x="375" y="40" font-family="sans-serif" font-size="22" font-weight="bold" fill="#212529" text-anchor="middle">
    混合気体とダルトンの分圧の法則
  </text>

  <!-- Section 1: ダルトンの分圧の法則 -->
  <g transform="translate(25, 60)">
    <rect width="700" height="200" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="2" />
    <text x="20" y="30" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0d6efd">
      1. ダルトンの分圧の法則 (全圧 = 分圧の和)
    </text>

    <!-- 気体A -->
    <g transform="translate(30, 50)">
      <rect width="110" height="90" rx="5" fill="#e7f1ff" stroke="#0d6efd" stroke-width="2" />
      <circle cx="30" cy="30" r="7" fill="#0d6efd" /><circle cx="80" cy="35" r="7" fill="#0d6efd" />
      <circle cx="50" cy="65" r="7" fill="#0d6efd" /><circle cx="90" cy="70" r="7" fill="#0d6efd" />
      <text x="55" y="115" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0d6efd" text-anchor="middle">気体 A</text>
      <text x="55" y="133" font-family="sans-serif" font-size="13" fill="#495057" text-anchor="middle">分圧: PA</text>
    </g>

    <text x="165" y="105" font-family="sans-serif" font-size="28" font-weight="bold" fill="#6c757d">+</text>

    <!-- 気体B -->
    <g transform="translate(190, 50)">
      <rect width="110" height="90" rx="5" fill="#ffe2e5" stroke="#dc3545" stroke-width="2" />
      <polygon points="40,25 48,40 32,40" fill="#dc3545" />
      <polygon points="75,55 83,70 67,70" fill="#dc3545" />
      <text x="55" y="115" font-family="sans-serif" font-size="14" font-weight="bold" fill="#dc3545" text-anchor="middle">気体 B</text>
      <text x="55" y="133" font-family="sans-serif" font-size="13" fill="#495057" text-anchor="middle">分圧: PB</text>
    </g>

    <text x="325" y="105" font-family="sans-serif" font-size="28" font-weight="bold" fill="#6c757d">=</text>

    <!-- 混合気体 -->
    <g transform="translate(350, 50)">
      <rect width="130" height="90" rx="5" fill="#ffffff" stroke="#212529" stroke-width="2.5" />
      <circle cx="30" cy="30" r="7" fill="#0d6efd" /><circle cx="90" cy="35" r="7" fill="#0d6efd" />
      <circle cx="50" cy="65" r="7" fill="#0d6efd" /><circle cx="100" cy="70" r="7" fill="#0d6efd" />
      <polygon points="70,25 78,40 62,40" fill="#dc3545" />
      <polygon points="30,60 38,75 22,75" fill="#dc3545" />
      <text x="65" y="115" font-family="sans-serif" font-size="14" font-weight="bold" fill="#212529" text-anchor="middle">混合気体</text>
      <text x="65" y="133" font-family="sans-serif" font-size="13" font-weight="bold" fill="#212529" text-anchor="middle">全圧: Ptotal</text>
    </g>

    <!-- 公式枠 -->
    <rect x="505" y="70" width="175" height="50" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="2" />
    <text x="592" y="100" font-family="sans-serif" font-size="15" font-weight="bold" fill="#664d03" text-anchor="middle">
      Ptotal = PA + PB + ...
    </text>
  </g>

  <!-- Section 2: モル分率と分圧 -->
  <g transform="translate(25, 285)">
    <rect width="700" height="190" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="2" />
    <text x="20" y="30" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0d6efd">
      2. モル分率（存在割合）と分圧の関係
    </text>

    <!-- 説明エリア -->
    <g transform="translate(30, 50)">
      <rect width="280" height="115" rx="5" fill="#f8f9fa" stroke="#ced4da" stroke-width="1" />
      <text x="15" y="30" font-family="sans-serif" font-size="14" font-weight="bold" fill="#212529">
        成分 A のモル分率 (XA)
      </text>
      <text x="15" y="55" font-family="sans-serif" font-size="13" fill="#495057">
        全体分子数に対する成分Aの割合
      </text>
      <text x="140" y="90" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0d6efd" text-anchor="middle">
        XA = nA / ntotal
      </text>
    </g>

    <!-- 矢印 -->
    <path d="M 330,105 L 370,105" stroke="#6c757d" stroke-width="3" fill="none" />
    <polygon points="370,98 382,105 370,112" fill="#6c757d" />

    <!-- 公式大枠 -->
    <g transform="translate(400, 50)">
      <rect width="270" height="115" rx="5" fill="#d1e7dd" stroke="#198754" stroke-width="2" />
      <text x="135" y="40" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f5132" text-anchor="middle">
        【 分圧の計算 】
      </text>
      <text x="135" y="75" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0f5132" text-anchor="middle">
        PA = XA × Ptotal
      </text>
      <text x="135" y="100" font-family="sans-serif" font-size="12" fill="#146c43" text-anchor="middle">
        (Aの分圧 ＝ Aの割合 × 全体の圧力)
      </text>
    </g>
  </g>
</svg>