<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2878a5"/>
    </marker>
    <marker id="axisArrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#333"/>
    </marker>
    <style>
      text { font-family: "Noto Sans CJK JP", "Yu Gothic", "Meiryo", sans-serif; fill: #202b36; }
      .title { font-size: 32px; font-weight: 700; }
      .label { font-size: 22px; }
      .small { font-size: 18px; }
      .value { font-size: 25px; font-weight: 700; }
    </style>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="600" y="54" text-anchor="middle" class="title">熱化学におけるエンタルピーの基準（ゼロ点）</text>
  <text x="600" y="88" text-anchor="middle" class="small">エンタルピーの絶対値よりも、状態間の差 ΔH が重要</text>

  <!-- Main energy-level diagram -->
  <line x1="105" y1="590" x2="105" y2="150" stroke="#333" stroke-width="3" marker-end="url(#axisArrow)"/>
  <text x="58" y="365" text-anchor="middle" class="label" transform="rotate(-90 58 365)">エンタルピー H</text>

  <line x1="155" y1="245" x2="735" y2="245" stroke="#2878a5" stroke-width="5"/>
  <rect x="170" y="174" width="355" height="52" rx="12" fill="#e5f3fb" stroke="#2878a5" stroke-width="2"/>
  <text x="347" y="207" text-anchor="middle" class="label" font-weight="700">単体（H_2 + 1/2O2)</text>
<text x="690" y="373" font-size="18" fill="#2878a5">Δ<tspan baseline-shift="sub" font-size="18">f</tspan>H°= 0</text>


  <text x="550" y="277" class="small">基準として定義</text>

  <line x1="155" y1="475" x2="735" y2="475" stroke="#c46b32" stroke-width="5"/>
  <rect x="170" y="495" width="250" height="52" rx="12" fill="#fff0e5" stroke="#c46b32" stroke-width="2"/>
  <text x="295" y="528" text-anchor="middle" class="label" font-weight="700">水 H₂O(l)</text>
  <text x="450" y="515" class="value" fill="#a64f1d">Δ<tspan baseline-shift="sub" font-size="18">f</tspan>H° = −285.8</text>
  <text x="450" y="543" class="small">kJ/mol</text>

  <line x1="675" y1="267" x2="675" y2="451" stroke="#2878a5" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="690" y="342" class="label" fill="#2878a5">水の生成</text>
  <text x="690" y="373" class="small" fill="#2878a5">Δ<tspan baseline-shift="sub" font-size="12">f</tspan>H°</text>
  <text x="690" y="401" class="value" fill="#2878a5">= −285.8</text>
  <text x="690" y="426" class="small" fill="#2878a5">kJ/mol</text>

  <!-- Explanation panel -->
  <rect x="790" y="155" width="350" height="390" rx="18" fill="#f6f8fa" stroke="#b8c5cf" stroke-width="2"/>
  <text x="965" y="195" text-anchor="middle" class="label" font-weight="700">ここがポイント</text>
  <circle cx="825" cy="240" r="7" fill="#2878a5"/>
  <text x="845" y="247" class="small">ゼロ点は約束で決める</text>
  <circle cx="825" cy="292" r="7" fill="#2878a5"/>
  <text x="845" y="299" class="small">単体の標準状態では</text>
  <text x="845" y="326" class="small">標準生成エンタルピーを 0</text>
  <circle cx="825" cy="371" r="7" fill="#2878a5"/>
  <text x="845" y="378" class="small">負の値は「基準より低い」</text>
  <circle cx="825" cy="423" r="7" fill="#2878a5"/>
  <text x="845" y="430" class="small">反応熱は前後の差 ΔH</text>
  <text x="965" y="490" text-anchor="middle" class="small" font-weight="700">H₂ + ½O₂ → H₂O(l)</text>
  <text x="965" y="519" text-anchor="middle" class="small">発熱反応：エンタルピーが低下</text>

  <!-- Same-gap analogy -->
  <rect x="155" y="620" width="985" height="95" rx="16" fill="#f0f7ed" stroke="#9ab78c" stroke-width="2"/>
  <text x="180" y="655" class="label" font-weight="700">たとえ：</text>
  <text x="290" y="655" class="small">標高の基準を変えても、2地点の高低差は変わらない。</text>
  <line x1="300" y1="685" x2="480" y2="685" stroke="#758b69" stroke-width="3"/>
  <line x1="300" y1="700" x2="480" y2="700" stroke="#758b69" stroke-width="3"/>
  <line x1="390" y1="686" x2="390" y2="699" stroke="#2878a5" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="515" y="695" class="small">基準（ゼロ点）は変えられるが、差 ΔH は同じ</text>
</svg>
