<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Molecular Interaction Simulator</title>

<style>

body{
    margin:0;
    background:black;
    color:white;
    font-family:Arial;
}

.container{
    display:flex;
    padding:15px;
    gap:20px;
}

.left{
    flex:1;
}

.right{
    width:320px;
    padding:15px;
    border-radius:12px;
    background:#d8d3ff;
    color:black;
}

.right input{
    width:100%;
}

canvas{
    border:1px solid #555;
    background:#111;
}

h3{
    margin-top:0;
}

</style>
</head>
<body>

<div class="container">

<div class="left">

<canvas id="graph"
        width="750"
        height="400">
</canvas>

<br><br>

<canvas id="molecule"
        width="750"
        height="280">
</canvas>

</div>

<div class="right">

<h3>Molecule</h3>

<label>
<input type="radio"
       name="species"
       value="water"
       checked>
H₂O
</label><br>

<label>
<input type="radio"
       name="species"
       value="neon">
Ne
</label><br>

<label>
<input type="radio"
       name="species"
       value="argon">
Ar
</label>

<hr>

σ =
<span id="sigmaText"></span>

<input type="range"
       id="sigma"
       min="2"
       max="6"
       step="0.1"
       value="3.2">

<br><br>

ε =
<span id="epsilonText"></span>

<input type="range"
       id="epsilon"
       min="0.2"
       max="5"
       step="0.1"
       value="1.5">

<br><br>

Hydrogen Bond

<span id="hbText"></span>

<input type="range"
       id="hb"
       min="0"
       max="3"
       step="0.05"
       value="1">

<br><br>

Distance r

<span id="rText"></span>

<input type="range"
       id="distance"
       min="2"
       max="10"
       step="0.05"
       value="4">

<hr>

<div id="info"></div>

</div>

</div>


<script>

const graph=
document.getElementById("graph");

const g=
graph.getContext("2d");

const mol=
document.getElementById("molecule");

const m=
mol.getContext("2d");

function LJ(r,sigma,epsilon){

    return 4*epsilon*
    (
        Math.pow(sigma/r,12)
        -
        Math.pow(sigma/r,6)
    );
}

function HB(r,hb){

    return -hb*
           Math.exp(
           -(r-3.0)*(r-3.0)
           );
}

function totalPotential(
    r,
    sigma,
    epsilon,
    hb
){

    return LJ(
        r,
        sigma,
        epsilon
    )
    +
    HB(r,hb);
}

function drawWater(
    ctx,
    x,
    y,
    angle
){

    const OH=35;

    const th=
    104.5*Math.PI/180;

    const x1=
    x+
    OH*Math.cos(
    angle+th/2);

    const y1=
    y+
    OH*Math.sin(
    angle+th/2);

    const x2=
    x+
    OH*Math.cos(
    angle-th/2);

    const y2=
    y+
    OH*Math.sin(
    angle-th/2);

    ctx.strokeStyle="white";
    ctx.lineWidth=4;

    ctx.beginPath();
    ctx.moveTo(x,y);
    ctx.lineTo(x1,y1);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(x,y);
    ctx.lineTo(x2,y2);
    ctx.stroke();

    ctx.fillStyle="red";

    ctx.beginPath();
    ctx.arc(
        x,y,20,
        0,2*Math.PI
    );
    ctx.fill();

    ctx.fillStyle="white";

    ctx.beginPath();
    ctx.arc(
        x1,y1,10,
        0,2*Math.PI
    );
    ctx.fill();

    ctx.beginPath();
    ctx.arc(
        x2,y2,10,
        0,2*Math.PI
    );
    ctx.fill();
}

function drawAtom(
    ctx,
    x,
    y,
    radius,
    color
){

    let grad=
    ctx.createRadialGradient(
        x-5,
        y-5,
        5,
        x,
        y,
        radius
    );

    grad.addColorStop(
        0,
        "#ffffff"
    );

    grad.addColorStop(
        1,
        color
    );

    ctx.fillStyle=grad;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        radius,
        0,
        2*Math.PI
    );

    ctx.fill();
}

function drawGraph(
    sigma,
    epsilon,
    hb,
    r
){

    g.clearRect(
        0,
        0,
        graph.width,
        graph.height
    );

    g.strokeStyle="#555";

    for(let i=0;i<6;i++){

        g.beginPath();

        g.moveTo(i*150,0);

        g.lineTo(
            i*150,
            400
        );

        g.stroke();
    }

    for(let i=0;i<5;i++){

        g.beginPath();

        g.moveTo(
            0,
            i*100
        );

        g.lineTo(
            750,
            i*100
        );

        g.stroke();
    }

    g.strokeStyle="red";
    g.lineWidth=3;

    g.beginPath();

    let first=true;

    for(let rr=2;rr<=12;rr+=0.03){

        let U=
        totalPotential(
            rr,
            sigma,
            epsilon,
            hb
        );

        let x=
        60+
        (rr-2)*60;

        let y=
        220-U*40;

        if(first){

            g.moveTo(x,y);
            first=false;

        }else{

            g.lineTo(x,y);
        }
    }

    g.stroke();

    let U=
    totalPotential(
        r,
        sigma,
        epsilon,
        hb
    );

    let px=
    60+
    (r-2)*60;

    let py=
    220-U*40;

    g.fillStyle="magenta";

    g.beginPath();

    g.arc(
        px,
        py,
        8,
        0,
        2*Math.PI
    );

    g.fill();

    g.fillStyle="white";

    g.font="20px Arial";

    g.fillText(
        "Distance Between Molecules",
        220,
        380
    );
}

function drawMolecules(
    r,
    sigma,
    species
){

    m.clearRect(
        0,
        0,
        750,
        280
    );

    const x1=220;

    const x2=
    220+r*35;

    const y=140;

    if(species==="water"){

        drawWater(
            m,
            x1,
            y,
            0.3
        );

        drawWater(
            m,
            x2,
            y,
            -0.3
        );

    }else{

        let color=
        species==="neon"
        ? "#ff66ff"
        : "#66aaff";

        let radius=
        sigma*7;

        drawAtom(
            m,
            x1,
            y,
            radius,
            color
        );

        drawAtom(
            m,
            x2,
            y,
            radius,
            color
        );
    }
}

function update(){

    const sigma =
    parseFloat(
        document.getElementById("sigma").value
    );

    const epsilon =
    parseFloat(
        document.getElementById("epsilon").value
    );

    const hb =
    parseFloat(
        document.getElementById("hb").value
    );

    const r =
    parseFloat(
        document.getElementById("distance").value
    );

    const species =
    document.querySelector(
        'input[name="species"\]:checked'
    ).value;

    document.getElementById("sigmaText")
        .textContent = sigma.toFixed(2);

    document.getElementById("epsilonText")
        .textContent = epsilon.toFixed(2);

    document.getElementById("hbText")
        .textContent = hb.toFixed(2);

    document.getElementById("rText")
        .textContent = r.toFixed(2);

    drawGraph(
        sigma,
        epsilon,
        hb,
        r
    );

    drawMolecules(
        r,
        sigma,
        species
    );

    const U =
    totalPotential(
        r,
        sigma,
        epsilon,
        hb
    );

    const rm =
    Math.pow(2,1/6) * sigma;

    document.getElementById("info")
        .innerHTML =
        `
        U(r) = ${U.toFixed(3)}
        <br>
        r<sub>m</sub> = ${rm.toFixed(2)}
        <br>
        Species = ${species}
        `;
}

document
.querySelectorAll(
'input')
.forEach(el=>
el.addEventListener(
'input',
update));

update();

</script>

</body>
</html>
